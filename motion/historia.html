<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#070B16;font-family:Inter,sans-serif;color:#EEF1FA}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden}
#bgday{position:absolute;inset:0;background:radial-gradient(1000px 900px at 50% 25%,#2a4fc4 0%,#0f1c45 60%,#0a1230 100%)}
#bgnight{position:absolute;inset:0;background:radial-gradient(900px 800px at 50% 20%,#0f1838 0%,#04060d 70%)}
.star{position:absolute;width:5px;height:5px;border-radius:50%;background:#fff}
.t{position:absolute;left:60px;right:60px;text-align:center;font-weight:800;letter-spacing:-2px;line-height:1.05}
.acc{color:#8EA6FF}.red{color:#ff6b7a}
#phone{position:absolute;left:190px;top:440px;width:700px;height:1180px;border-radius:90px;background:#0D1324;border:4px solid rgba(160,185,255,.25);box-shadow:0 40px 120px rgba(0,0,0,.5);overflow:hidden}
#phone .notch{position:absolute;left:250px;top:18px;width:200px;height:36px;border-radius:18px;background:#000;z-index:5}
.pane{position:absolute;inset:0;padding:90px 30px 30px}
.n{position:absolute;left:30px;right:30px;height:128px;border-radius:30px;background:#1a2342;border:2px solid rgba(160,185,255,.15);padding:20px 26px;font-size:28px;font-weight:700}
.n small{display:block;font-weight:500;font-size:25px;color:#B2BBD3;margin-top:8px}
.n .dot{float:right;font-size:22px;color:#838DAA;font-weight:600}
.bub{position:absolute;max-width:480px;padding:22px 28px;border-radius:34px;font-size:31px;font-weight:500;line-height:1.3}
.lead{left:30px;background:#1c2540;border-bottom-left-radius:10px}
.ai{right:30px;background:#5B7BFF;color:#fff;border-bottom-right-radius:10px}
.hdr{position:absolute;left:0;right:0;top:0;height:150px;background:#131B31;padding:80px 34px 0;font-size:30px;font-weight:700;border-bottom:2px solid rgba(160,185,255,.12)}
.hdr small{font-weight:500;color:#6fe3a0;font-size:24px;margin-left:12px}
.slot{position:absolute;left:30px;right:30px;height:150px;border-radius:26px;border:2px dashed rgba(160,185,255,.18)}
.slot .h{position:absolute;left:24px;top:16px;font-size:24px;color:#838DAA;font-weight:600}
.mt{position:absolute;left:30px;right:30px;height:150px;border-radius:26px;background:linear-gradient(90deg,#3b5be0,#5B7BFF);padding:26px 30px;font-size:32px;font-weight:700}
.mt small{display:block;font-weight:500;font-size:25px;opacity:.85;margin-top:8px}
.card{position:absolute;left:30px;right:30px;border-radius:34px;background:#12331f;border:2px solid #2fbf71;padding:30px;font-size:34px;font-weight:700}
.card small{display:block;font-weight:500;font-size:27px;color:#9be6bd;margin-top:8px}
svg.av{position:absolute}
#cta{position:absolute;left:0;right:0;text-align:center}
</style></head><body><div id="stage">
<div id="bgday"></div><div id="bgnight"></div><div id="stars"></div>
<div class="t" id="t1" style="top:150px;font-size:96px">Leads chegando<br><span class="acc">a toda hora</span></div>
<div class="t" id="t2" style="top:130px;font-size:150px" ><span id="clock">23:40</span></div>
<div class="t" id="t2b" style="top:330px;font-size:60px;letter-spacing:-1px;font-weight:700">O dono dorme. <span class="red">Os leads não.</span></div>
<div class="t" id="t3" style="top:150px;font-size:92px">Mas a <span class="acc">IA da Zioon</span><br>atende por você</div>
<div class="t" id="tE" style="top:150px;font-size:80px">E já cai <span class="acc">sozinho</span><br>na agenda do vendedor</div>
<div class="t" id="t4" style="top:130px;font-size:92px">No dia seguinte:<br><span class="acc">agenda cheia</span></div>
<div id="phone"><div class="notch"></div>
 <div class="pane" id="pA"></div>
 <div class="pane" id="pB"></div>
 <div class="pane" id="pC"></div>
 <div class="pane" id="pE"></div>
 <div class="pane" id="pD"></div>
</div>
<div class="t" id="cnt" style="top:1665px;font-size:64px;letter-spacing:-1px"></div>
<!-- avatars -->
<img id="owner" src="dono.jpg" style="position:absolute;left:50px;top:1610px;width:230px;height:230px;border-radius:50%;object-fit:cover;border:8px solid #5B7BFF;box-shadow:0 0 40px rgba(91,123,255,.5)">
<div class="t" id="zzz" style="left:290px;right:auto;text-align:left;top:1600px;font-size:60px;color:#8EA6FF;letter-spacing:0">Z z z</div>
<img id="presenter" src="vendedor.jpg" style="position:absolute;left:50px;top:540px;width:300px;height:300px;border-radius:50%;object-fit:cover;border:10px solid #5B7BFF;box-shadow:0 0 60px rgba(91,123,255,.55)">
<div id="bubble" style="position:absolute;left:390px;right:50px;top:590px;padding:44px 48px;border-radius:44px;border-top-left-radius:10px;background:#fff;color:#0a1230;font-size:50px;font-weight:700;line-height:1.2">Quer conhecer melhor <span style="color:#3b5be0">o processo?</span></div>
<img id="logo" src="logo.png" style="position:absolute;left:410px;top:1000px;width:260px;height:260px;border-radius:60px">
<div class="t" id="brand" style="top:1290px;font-size:110px">Zioon CRM</div>
<div id="cta" style="top:1470px"><span style="display:inline-block;padding:38px 90px;border-radius:90px;background:#5B7BFF;font-size:56px;font-weight:700">Agende uma conversa</span></div>
</div><script>
const $=id=>document.getElementById(id);
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const ease=x=>1-Math.pow(1-clamp(x),3);
const back=x=>{x=clamp(x);const c=1.70158;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
function win(t,a,b,fi=.4,fo=.35){return Math.min(ease((t-a)/fi),1-ease((t-(b-fo))/fo))}
function show(el,t,a,b,y=50){const k=win(t,a,b);el.style.opacity=k;el.style.transform=`translateY(${(1-ease((t-a)/.5))*y}px)`}
// stars
for(let i=0;i<40;i++){const s=document.createElement('div');s.className='star';s.style.left=(Math.abs(Math.sin(i*91.7))*1070)+'px';s.style.top=(Math.abs(Math.sin(i*37.3))*900)+'px';s.style.opacity=.3+.7*Math.abs(Math.sin(i));$('stars').appendChild(s)}
// pane A: day notifications
const src=[['WhatsApp','Maria: Vi seu anúncio, tem valor?'],['Instagram','Novo lead: João S.'],['Site','Formulário: Clínica Vida'],['WhatsApp','Carlos: Posso agendar?'],['Instagram','Novo lead: Paula R.'],['WhatsApp','Ana: Quero um orçamento']];
const nA=src.map((s,i)=>{const d=document.createElement('div');d.className='n';d.style.top=(100+i*150)+'px';d.innerHTML=`<span class="dot">agora</span>${s[0]}<small>${s[1]}</small>`;$('pA').appendChild(d);return d});
// pane B: night unanswered
const srcB=[['WhatsApp','Rafael: Tem horário amanhã?'],['Instagram','Novo lead: Bianca'],['WhatsApp','Lucas: Oi, tem alguém aí?'],['Site','Formulário: Studio Fit'],['WhatsApp','Fernanda: Quero saber valores'],['Instagram','Novo lead: Diego']];
const nB=srcB.map((s,i)=>{const d=document.createElement('div');d.className='n';d.style.top=(100+i*150)+'px';d.style.borderColor='rgba(255,107,122,.5)';d.innerHTML=`<span class="dot" style="color:#ff6b7a">sem resposta</span>${s[0]}<small>${s[1]}</small>`;$('pB').appendChild(d);return d});
// pane C chat
$('pC').innerHTML='<div class="hdr">Assistente Zioon <small>● online</small></div>';
const chat=[['lead',8.3,'Oi, vi o anúncio de vocês. Ainda tem vaga?',230],['ai',9.4,'Oi! Tem sim. Me conta, o que você precisa?',390],['lead',10.9,'Quero aumentar minhas vendas',540],['ai',12.0,'Perfeito! Posso agendar uma conversa com o consultor. Amanhã às 10h?',690],['lead',13.5,'Fica ótimo!',920]];
const bub=chat.map(c=>{const d=document.createElement('div');d.className='bub '+c[0];d.style.top=c[3]+'px';d.textContent=c[2];$('pC').appendChild(d);return d});
const typ=document.createElement('div');typ.className='bub ai';typ.style.top='0px';typ.innerHTML='<b style="letter-spacing:6px">• • •</b>';$('pC').appendChild(typ);
const card=document.createElement('div');card.className='card';card.style.top='1010px';card.innerHTML='Reunião agendada<small>Amanhã, 10:00 · lead qualificado</small>';$('pC').appendChild(card);
// pane D agenda
$('pD').innerHTML='<div class="hdr">Agenda · Hoje</div>';
const hrs=[['08:30','Clínica Vida','Reunião de apresentação'],['10:00','João Silva','Reunião de apresentação'],['11:30','Studio Fit','Reunião de apresentação'],['14:00','Paula Ribeiro','Reunião de apresentação'],['16:30','Carlos Alves','Reunião de apresentação']];
const mt=hrs.map((h,i)=>{const s=document.createElement('div');s.className='slot';s.style.top=(180+i*190)+'px';s.innerHTML=`<span class="h">${h[0]}</span>`;$('pD').appendChild(s);const m=document.createElement('div');m.className='mt';m.style.top=(180+i*190)+'px';m.innerHTML=`${h[0]} · ${h[1]}<small>${h[2]}</small>`;$('pD').appendChild(m);return m});
$('pE').innerHTML='<div class="hdr">Agenda · Vendedor Lucas <small style="color:#8EA6FF">● Calendar</small></div>';
['08:30','10:00','11:30','14:00'].forEach((h,i)=>{const sl=document.createElement('div');sl.className='slot';sl.style.top=(180+i*190)+'px';sl.innerHTML=`<span class="h">${h}</span>`;$('pE').appendChild(sl)});
const ev=document.createElement('div');ev.className='mt';ev.style.top='370px';ev.style.height='170px';ev.innerHTML='10:00 · João Silva<small>Reunião de apresentação · lead da IA</small>';$('pE').appendChild(ev);
const ok=document.createElement('div');ok.className='card';ok.style.top='960px';ok.innerHTML='Adicionado automaticamente<small>Sem ninguém digitar nada. Lembrete enviado ao vendedor.</small>';$('pE').appendChild(ok);
function fmt(m){m=Math.floor(m)%1440;return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')}
window.render=function(t){
 const night=clamp(Math.min(ease((t-3.7)/.6),1-ease((t-17.9)/.6)));
 $('bgnight').style.opacity=night;$('stars').style.opacity=night;
 // titles
 show($('t1'),t,.2,3.9);
 const nb=win(t,3.9,8.0);show($('t2'),t,3.9,8.0,30);show($('t2b'),t,4.4,8.0,30);
 $('clock').textContent=fmt(23*60+40+ clamp((t-3.9)/3.5)*212);
 show($('t3'),t,8.0,15.0,40);
 show($('tE'),t,15.0,17.9,40);show($('t4'),t,17.9,22.0,40);
 // phone
 const pv=win(t,.4,22.0,.6,.5);$('phone').style.opacity=pv;$('phone').style.transform=`translateY(${(1-ease((t-.4)/.7))*120}px)`;
 $('pA').style.opacity=win(t,.4,4.4,.1,.4);$('pB').style.opacity=win(t,4.3,8.6,.4,.4);
 $('pC').style.opacity=win(t,8.1,15.4,.4,.4);$('pE').style.opacity=win(t,15.0,17.9,.4,.4);$('pD').style.opacity=win(t,17.7,22.0,.4,.4);
 nA.forEach((n,i)=>{const p=back((t-(1+i*.45))/.5);n.style.opacity=clamp(p);n.style.transform=`translateY(${(1-clamp(p))*-60}px) scale(${.9+.1*clamp(p)})`});
 nB.forEach((n,i)=>{const p=back((t-(4.7+i*.5))/.5);n.style.opacity=clamp(p);n.style.transform=`translateY(${(1-clamp(p))*-60}px)`});
 // counters
 const c1=Math.floor(clamp((t-1)/2.6)*37);
 const c2=Math.floor(clamp((t-4.7)/3)*12);
 let ct='',ck=0;
 if(t<4.2){ct=`<span class="acc">+${c1}</span> leads hoje`;ck=win(t,1,4.2)}
 else if(t<8.4){ct=`<span class="red">${c2}</span> mensagens sem resposta`;ck=win(t,4.7,8.2)}
 $('cnt').innerHTML=ct;$('cnt').style.left=(t>=4.2&&t<8.4)?'290px':'60px';$('cnt').style.fontSize=(t>=4.2&&t<8.4)?'50px':'64px';$('cnt').style.opacity=ck;
 // owner
 const asleep=t>=4.2&&t<15.4;
 const ov=(t>=4.2&&t<8.4)?win(t,4.4,8.4):(t>=17.8&&t<22.0?win(t,18.0,22.0):0);
 $('owner').style.opacity=ov;
 $('owner').style.top=(t>=17.8?'1630px':'1620px');
 $('owner').style.filter=(t<18.2)?'grayscale(.6) brightness(.55)':'none';
 $('zzz').style.opacity=(t>=4.2&&t<8.4)?win(t,4.6,8.4)*(.6+.4*Math.sin(t*5)):0;
 $('zzz').style.transform=`translateY(${-Math.sin(t*3)*8}px)`;
 // chat
 chat.forEach((c,i)=>{const p=ease((t-c[1])/.35);bub[i].style.opacity=p;bub[i].style.transform=`translateY(${(1-p)*30}px)`});
 // typing before ai msgs
 const tw=[[8.6,9.4,390],[11.2,12.0,690]];let tv=0;
 tw.forEach(w=>{if(t>=w[0]&&t<w[1]){tv=1;typ.style.top=w[2]+'px'}});typ.style.opacity=tv;
 // last AI line after customer's ok
 const cp=back((t-14.3)/.5);card.style.opacity=clamp(cp);card.style.transform=`scale(${.9+.1*clamp(cp)})`;
 // sync pane
 const ep=back((t-15.6)/.6);ev.style.opacity=clamp(ep);ev.style.transform=`translateY(${(1-clamp(ep))*-200}px) scale(${.9+.1*clamp(ep)})`;
 const op=back((t-16.5)/.5);ok.style.opacity=clamp(op);ok.style.transform=`scale(${.9+.1*clamp(op)})`;
 // agenda
 mt.forEach((m,i)=>{const p=back((t-(18.4+i*.4))/.5);m.style.opacity=clamp(p);m.style.transform=`translateX(${(1-clamp(p))*300}px)`});
 // final
 const f=ease((t-22.2)/.5);
 $('presenter').style.opacity=f;$('presenter').style.transform=`scale(${.8+.2*back((t-22.2)/.7)})`;
 const b=back((t-22.8)/.6);$('bubble').style.opacity=clamp(b);$('bubble').style.transform=`scale(${.85+.15*clamp(b)})`;
 const l=ease((t-23.6)/.5);$('logo').style.opacity=l;$('brand').style.opacity=l;
 const cc=back((t-24.2)/.6);$('cta').style.opacity=clamp(cc);$('cta').style.transform=`scale(${.85+.15*clamp(cc)})`;
};
window.render(0);
</script></body></html>
